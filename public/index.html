<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BART Live Tracker</title>
</head>
<body>
  <h1>BART Live Tracker</h1>
  <p id="updated">Loading...</p>
  <pre id="out"></pre>
  <script>
    fetch("bart_data.json")
      .then(r => r.json())
      .then(d => {
        document.getElementById("updated").textContent =
          "Last updated: " + d.metadata.last_updated;
        document.getElementById("out").textContent =
          d.metadata.total_records + " train estimates across " +
          d.stations.length + " stations";
      });
  </script>
</body>
</html>
