
name: Build and Deploy BART Live Tracker

on:
  push:
    branches:
      - main

  schedule:
    - cron: "3-59/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bart-live-tracker-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Debug repository files
        run: |
          echo "Current directory:"
          pwd

          echo "Root files:"
          ls -la

          echo "Python files:"
          find . -maxdepth 3 -name "*.py"

          echo "Checking build_site.py:"
          test -f build_site.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Fetch BART data and build JSON
        run: python ./build_site.py

      - name: Verify generated files
        run: |
          echo "Checking public directory:"
          ls -la public

          test -s public/index.html
          test -s public/bart_data.json

          python -m json.tool public/bart_data.json > /dev/null

          echo "JSON validation successful!"

      - name: Deploy website
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
