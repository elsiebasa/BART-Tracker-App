name: Build and Deploy BART Live Tracker

on:
  push:
    branches:
      - main

  schedule:
    - cron: "3-59/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bart-live-tracker
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Debug repository files
        run: |
          echo "Current directory:"
          pwd

          echo "Root files:"
          ls -la

          echo "Python files:"
          find . -maxdepth 3 -name "*.py"

          test -f build_site.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Fetch BART data and build JSON
        run: |
          rm -f public/bart_data.json
          python ./build_site.py
          echo "Current time (UTC):"
          date -u
          echo "Generated file says:"
          grep last_updated public/bart_data.json

      - name: Verify generated files
        run: |
          echo "Checking public directory:"
          ls -la public

          test -s public/index.html
          test -s public/bart_data.json

          python -m json.tool public/bart_data.json > /dev/null

          python - <<'EOF'
          import json
          from datetime import datetime, timezone
          data = json.load(open("public/bart_data.json"))
          stamp = datetime.strptime(data["metadata"]["last_updated"], "%Y-%m-%d %H:%M:%S UTC").replace(tzinfo=timezone.utc)
          age = (datetime.now(timezone.utc) - stamp).total_seconds()
          print(f"Data age: {age:.0f} seconds")
          assert age < 600, "bart_data.json is stale!"
          EOF

          echo "JSON validation successful!"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
