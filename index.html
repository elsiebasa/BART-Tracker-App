<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>BART Live Departure Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 p-4 sm:p-6 flex flex-col items-center">
  <main class="w-full max-w-2xl mt-6">
    <header class="mb-8 text-center">
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
        BART Live Departure Board
      </h1>
      <p class="text-sm text-slate-400 mt-2">
        Data refreshes when the scheduled pipeline succeeds.
        Last data update: <span id="update-time" class="text-slate-200 font-mono">Loading...</span>
      </p>
      <p id="refresh-status" class="text-xs text-slate-500 mt-1" aria-live="polite">Loading station list and departure data…</p>
    </header>

    <section class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl mb-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label for="station-picker" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Select Station</label>
        <select id="station-picker" disabled class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 font-medium disabled:opacity-60">
          <option value="">Loading stations…</option>
        </select>
      </div>
      <div>
        <label for="direction-picker" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Direction</label>
        <select id="direction-picker" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 font-medium">
          <option value="ALL">All Directions</option>
          <option value="North">Northbound</option>
          <option value="South">Southbound</option>
        </select>
      </div>
    </section>

    <section id="train-container" class="space-y-4" aria-live="polite" aria-busy="true">
      <div class="text-center py-12 text-slate-500">Loading train estimates…</div>
    </section>

    <footer class="text-center text-xs text-slate-500 mt-8">
      Departure estimates are provided by BART. Times may change.
      <a class="underline hover:text-slate-300" href="https://www.bart.gov/schedules/developers/api" target="_blank" rel="noopener noreferrer">BART API information</a>
    </footer>
  </main>

  <script>
    "use strict";

    let db = { metadata: {}, stations: [], trains: [] };
    let hasLoadedData = false;

    const stationPicker = document.getElementById("station-picker");
    const directionPicker = document.getElementById("direction-picker");
    const trainContainer = document.getElementById("train-container");
    const updateTimeLabel = document.getElementById("update-time");
    const refreshStatus = document.getElementById("refresh-status");

    function addText(parent, tag, text, className = "") {
      const element = document.createElement(tag);
      element.textContent = String(text ?? "");
      if (className) element.className = className;
      parent.appendChild(element);
      return element;
    }

    function showMessage(message, className = "text-center py-12 bg-slate-800/40 border border-dashed border-slate-700 rounded-2xl text-slate-400") {
      trainContainer.replaceChildren();
      addText(trainContainer, "div", message, className);
    }

    // The pipeline writes public/bart_data.json. Try both paths so this page
    // works whether the site is served from the repository root or public/.
    async function fetchPublishedData() {
      const paths = ["./bart_data.json", "./public/bart_data.json"];
      let lastError = null;

      for (const path of paths) {
        try {
          const response = await fetch(`${path}?t=${Date.now()}`, {
            cache: "no-store"
          });
          if (!response.ok) {
            throw new Error(`${path} returned HTTP ${response.status}`);
          }

          const nextDb = await response.json();
          if (!nextDb || !Array.isArray(nextDb.stations) || !Array.isArray(nextDb.trains)) {
            throw new Error(`${path} does not contain the expected stations and trains arrays`);
          }

          return nextDb;
        } catch (error) {
          lastError = error;
        }
      }

      throw lastError || new Error("Could not find the BART data JSON file.");
    }

    function populateStationPicker(stations) {
      const previousStation = stationPicker.value;
      const validStations = stations
        .filter(station => station && station.code && station.name)
        .sort((a, b) => String(a.name).localeCompare(String(b.name)));

      stationPicker.replaceChildren();
      stationPicker.appendChild(new Option("Choose a station…", ""));

      for (const station of validStations) {
        stationPicker.appendChild(new Option(station.name, station.code));
      }

      // Preserve the user's choice whenever the JSON data refreshes.
      stationPicker.value = validStations.some(station => station.code === previousStation)
        ? previousStation
        : "";
      stationPicker.disabled = validStations.length === 0;
    }

    async function initData() {
      try {
        const nextDb = await fetchPublishedData();
        if (!nextDb.stations.some(station => station && station.code && station.name)) {
          throw new Error("The JSON file does not contain any valid stations.");
        }

        db = {
          metadata: nextDb.metadata || {},
          stations: nextDb.stations,
          trains: nextDb.trains.filter(train => train && train.origin_code)
        };
        hasLoadedData = true;

        updateTimeLabel.textContent = db.metadata.last_updated || "Unknown";
        populateStationPicker(db.stations);
        renderDashboard();

        refreshStatus.textContent = `Data checked at ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        console.error("Unable to load BART data:", error);
        refreshStatus.textContent = hasLoadedData
          ? `Refresh failed at ${new Date().toLocaleTimeString()}; showing the last successfully loaded data.`
          : "Could not load BART data. Check that the data file has been published.";

        if (!hasLoadedData) {
          stationPicker.disabled = true;
          stationPicker.replaceChildren(new Option("Stations unavailable", ""));
          trainContainer.setAttribute("aria-busy", "false");
          showMessage(
            "Unable to load the station list or departure data. The data file may not have been published yet.",
            "text-center text-red-300 p-5 bg-red-950/40 rounded-xl border border-red-800"
          );
        }
      } finally {
        trainContainer.setAttribute("aria-busy", "false");
      }
    }

    function directionMatches(trainDirection, selectedDirection) {
      if (selectedDirection === "ALL") return true;
      const direction = String(trainDirection || "").toLowerCase();
      return direction.startsWith(selectedDirection.toLowerCase());
    }

    function minutesRank(value) {
      const normalized = String(value ?? "").trim().toLowerCase();
      if (normalized === "leaving") return -1;
      const numeric = Number(normalized);
      return normalized !== "" && Number.isFinite(numeric) ? numeric : Number.MAX_SAFE_INTEGER;
    }

    function renderDashboard() {
      if (!hasLoadedData) return;

      const selectedStation = stationPicker.value;
      const selectedDirection = directionPicker.value;
      trainContainer.replaceChildren();

      if (!selectedStation) {
        showMessage("Choose a BART station to view its departure estimates.");
        return;
      }

      const trains = db.trains
        .filter(train =>
          String(train.origin_code) === selectedStation &&
          directionMatches(train.direction, selectedDirection)
        )
        .sort((a, b) => minutesRank(a.minutes) - minutesRank(b.minutes));

      if (trains.length === 0) {
        showMessage("No departure estimates are currently available for this station and direction. Try another direction or check again after the next data refresh.");
        return;
      }

      for (const train of trains) {
        const card = document.createElement("article");
        card.className = "bg-slate-800 rounded-xl p-5 border border-slate-700 shadow-lg flex justify-between items-center gap-4";

        const details = document.createElement("div");
        details.className = "min-w-0";

        const heading = document.createElement("div");
        heading.className = "flex items-center gap-2 mb-1";

        const dot = document.createElement("span");
        dot.className = "w-3 h-3 rounded-full shrink-0";
        dot.style.backgroundColor = /^#[0-9a-f]{6}$/i.test(String(train.color || ""))
          ? train.color
          : "#64748b";
        dot.setAttribute("aria-hidden", "true");
        heading.appendChild(dot);

        addText(heading, "h3", train.destination || "Unknown destination", "text-lg sm:text-xl font-bold text-white");
        details.appendChild(heading);

        const direction = train.direction || "Unknown direction";
        const platform = train.platform || "N/A";
        const length = train.length || "N/A";
        addText(
          details,
          "p",
          `Platform ${platform} • ${length}-car train • ${direction}`,
          "text-xs text-slate-400"
        );

        const arrival = document.createElement("div");
        arrival.className = "text-right shrink-0";
        const minutes = String(train.minutes ?? "Unknown");
        const leaving = minutes.toLowerCase() === "leaving";
        addText(
          arrival,
          "span",
          leaving ? "Leaving now" : (minutes.toLowerCase() === "unknown" ? "Time unavailable" : `${minutes} min`),
          `inline-block px-3 py-2 rounded-lg font-bold text-sm ${leaving ? "bg-emerald-500 text-white" : "bg-slate-700 text-slate-200"}`
        );

        card.append(details, arrival);
        trainContainer.appendChild(card);
      }
    }

    stationPicker.addEventListener("change", renderDashboard);
    directionPicker.addEventListener("change", renderDashboard);

    initData();
    // Recheck for a newly published JSON file every minute.
    setInterval(initData, 60_000);
  </script>
</body>
</html>
